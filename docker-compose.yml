# ===========================================================================
# 개발용 docker compose
#   - 프론트엔드: Next.js dev (hot reload, 코드 볼륨 마운트)
#   - 백엔드:    Django (manage.py 가 없으면 dummy_server.py)
#   - DB:        Postgres 16
# 실행:
#   cp .env.example .env
#   docker compose up --build
# ===========================================================================

services:
  frontend:
    build:
      context: ./kdive-init
      dockerfile: Dockerfile.dev
    container_name: kdive-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_SURFY_CHAT_API_URL=${NEXT_PUBLIC_SURFY_CHAT_API_URL:-http://localhost:8000/api/chat/}
    volumes:
      # 소스는 호스트와 동기화해 hot reload
      - ./kdive-init:/app
      # node_modules / .next 는 컨테이너 전용 볼륨으로 분리 (호스트 OS와 호환성)
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    networks:
      - kdive-net

  backend:
    build:
      context: ./surfy-backend
      dockerfile: Dockerfile
    container_name: surfy-backend
    env_file:
      - ./surfy-backend/.env
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,surfy-backend}
      - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL:-postgres://surfy:surfy@db:5432/surfy}
    volumes:
      - ./surfy-backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kdive-net

  db:
    image: postgres:16-alpine
    container_name: surfy-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-surfy}
      - POSTGRES_USER=${POSTGRES_USER:-surfy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-surfy}
    ports:
      # 호스트에서 psql 로 접속 디버깅 가능 (필요 없으면 주석)
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surfy} -d ${POSTGRES_DB:-surfy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kdive-net

networks:
  kdive-net:
    driver: bridge

volumes:
  frontend_node_modules:
  frontend_next_cache:
  postgres_data:
