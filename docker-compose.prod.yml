# ===========================================================================
# 프로덕션용 docker compose
#   - 프론트엔드: Next.js standalone (multi-stage build, non-root)
#   - 백엔드:    Django (manage.py 가 있을 때 gunicorn 권장)
#   - DB:        Postgres 16 (포트 외부 노출 X)
# 실행:
#   cp .env.example .env  (값을 실제 운영용으로 변경)
#   docker compose -f docker-compose.prod.yml up --build -d
# ===========================================================================

services:
  frontend:
    build:
      context: ./kdive-init
      dockerfile: Dockerfile
    container_name: kdive-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SURFY_CHAT_API_URL=${NEXT_PUBLIC_SURFY_CHAT_API_URL}
    depends_on:
      - backend
    networks:
      - kdive-net

  backend:
    build:
      context: ./surfy-backend
      dockerfile: Dockerfile
    container_name: surfy-backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=0
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kdive-net

  db:
    image: postgres:16-alpine
    container_name: surfy-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kdive-net

networks:
  kdive-net:
    driver: bridge

volumes:
  postgres_data:
